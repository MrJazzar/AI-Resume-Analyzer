<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Resume Analyzer</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--primary);
  }
  .splash {
    text-align: center;
    color: #fff;
  }
  .splash .brand-mark {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--accent);
    color: #201400;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .splash h1 { color: #fff; font-size: 22px; }
  .splash .spinner { border-color: rgba(255,255,255,0.25); border-top-color: var(--accent-soft); margin: 18px auto 0; }
  .splash-actions { display: none; gap: 10px; justify-content: center; margin-top: 22px; }
</style>
</head>
<body>

<div class="splash">
  <div class="brand-mark">R</div>
  <h1>AI Resume Analyzer</h1>
  <div class="spinner" id="spinner"></div>
  <div class="splash-actions" id="actions">
    <a class="btn btn-accent" href="register.html">Create account</a>
    <a class="btn btn-ghost" style="color:#fff;border-color:rgba(255,255,255,0.4)" href="login.html">Sign in</a>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  api.get("/api/auth/me")
    .then(() => { window.location.href = "dashboard.html"; })
    .catch(() => {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("actions").style.display = "flex";
    });
</script>
</body>
</html>
